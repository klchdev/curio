# Render blueprint: one web service and one managed PostgreSQL.
#
# Render reads this when you point it at a fork, creates both, wires the
# database into the app and generates the two secrets itself. The only thing it
# has to ask you for is the Steam key — Valve hands those out to humans only.
#
# https://render.com/deploy?repo=https://github.com/klchdev/curio

databases:
  - name: curio-db
    databaseName: curio
    user: curio
    # Free PostgreSQL on Render is deleted after 30 days. Fine for a look
    # around, not for a journal you intend to keep — move to a paid plan, or to
    # a database elsewhere, before that runs out.
    plan: free

services:
  - type: web
    name: curio
    runtime: node
    plan: free
    healthCheckPath: /

    # --include=dev is not belt-and-braces: tailwindcss and @tailwindcss/vite
    # are devDependencies and astro.config.mjs imports them, so a production-only
    # install can't build at all. drizzle-kit comes along for the same reason —
    # the start command needs it.
    buildCommand: npm ci --include=dev && npm run build

    # The schema is applied with drizzle-kit push (there are no migration files
    # in the repo on purpose), so it has to happen before the server comes up,
    # on every deploy. Re-running it is free: push diffs the live database
    # against the schema and applies only what's missing.
    startCommand: npm run db:push && npm start

    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # The node adapter binds to localhost unless told otherwise, and a service
      # bound to localhost is invisible to Render's router
      - key: HOST
        value: 0.0.0.0

      - key: DATABASE_URL
        fromDatabase:
          name: curio-db
          property: connectionString

      # Yours from https://steamcommunity.com/dev/apikey. sync: false makes
      # Render stop and ask for it while it's setting the blueprint up.
      - key: STEAM_API_KEY
        sync: false

      # Random, generated by Render. Any long string works — the AES key is
      # derived from it — so whatever Render comes up with is fine.
      #
      # ENCRYPTION_KEY is the one to be careful with: copy it out of the Render
      # dashboard and keep it somewhere else. Everyone's stored model keys are
      # encrypted with a key derived from this exact string, so losing it or
      # regenerating it means they all have to be entered again.
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
