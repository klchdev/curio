<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
    <!--
      Кабинет редкостей: сетка ячеек — библиотека, одна заполненная —
      то, что выбрано для тебя. Читается на 16 пикселях, потому что
      держится на форме, а не на деталях.
    -->
    <rect x="3.5" y="3.5" width="25" height="25" rx="6" stroke="currentColor" stroke-width="2" />
    <rect x="9" y="9" width="6" height="6" rx="1.5" fill="#34d399" />
    <rect x="17" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.35" />
    <rect x="9" y="17" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.35" />
    <rect x="17" y="17" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.35" />
    <style>
        svg { color: #111827; }
        @media (prefers-color-scheme: dark) {
            svg { color: #e5e7eb; }
        }
    </style>
</svg>
